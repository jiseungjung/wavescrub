name: WaveScrub
options:
  bundleIdPrefix: com.jiseungjung
  deploymentTarget:
    iOS: "17.0"
targets:
  WaveScrub:
    type: application
    platform: iOS
    sources: [WaveScrub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiseungjung.wavescrub
        SWIFT_VERSION: "5.0"
        # Optimized even when run from Xcode: following a surfer through every
        # frame is far too slow in an unoptimized build.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: WaveScrub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "WaveScrub plays your videos straight from the photo library, without copying them."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "WaveScrub saves the clips you export to your photo library."
